openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: browser
    description: Public web page browser operations
paths:
  /activity/consent:
    get:
      operationId: getActivityConsent
      tags: [activity]
      summary: Read this browser's activity logging preference
      responses:
        "200":
          description: Logging preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityConsent"
    post:
      operationId: setActivityConsent
      tags: [activity]
      summary: Accept required activity logging or withdraw acceptance and lose browser/chat access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityConsentInput"
      responses:
        "200":
          description: Updated preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityConsent"
  /activity/access:
    post:
      operationId: recordDeviceAccess
      tags: [activity]
      summary: Record a return visit only for a consenting browser
      responses:
        "204":
          description: Access recorded, or browser has not opted in
  /owner/access:
    get:
      operationId: getOwnerAccess
      tags: [owner]
      summary: Owner authorization for the current verified account
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAccess"
  /owner/devices:
    get:
      operationId: listVisitorDevices
      tags: [owner]
      summary: List consenting browsers, newest first
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
      responses:
        "200":
          description: Paginated devices and unreviewed-device count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorDevicePage"
        "401":
          description: Sign-in required
        "403":
          description: Verified owner account required
  /owner/devices/review:
    post:
      operationId: reviewVisitorDevices
      tags: [owner]
      summary: Mark the specified new browsers as reviewed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceReviewInput"
      responses:
        "204":
          description: Devices marked reviewed
        "401":
          description: Sign-in required
        "403":
          description: Verified owner account required
  /owner/logs/chat.txt:
    get:
      operationId: downloadChatLog
      tags: [owner]
      summary: Download timestamped consenting chat records
      responses:
        "200":
          description: UTF-8 chat log
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Sign-in required
        "403":
          description: Verified owner account required
  /owner/logs/visits.txt:
    get:
      operationId: downloadVisitLog
      tags: [owner]
      summary: Download timestamped consenting browsing records
      responses:
        "200":
          description: UTF-8 visited-address log, without query strings or fragments
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Sign-in required
        "403":
          description: Verified owner account required
  /chat:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: Latest 50 shared messages, oldest first
      responses:
        "403":
          description: Activity logging must be accepted before reading chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the shared chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "403":
          description: Activity logging must be accepted before sending chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid username or message
        "429":
          description: Please wait before sending again
  /chat/name:
    put:
      operationId: setChatName
      tags: [chat]
      summary: Save this consenting browser's chosen chat name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatNameInput"
      responses:
        "200":
          description: Name saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatNameInput"
        "400":
          description: Invalid name
        "403":
          description: Activity consent or same-origin check failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /browser/run:
    post:
      operationId: runBrowser
      tags: [browser]
      summary: Open a public web page in Chromium
      description: Opens a public HTTP or HTTPS page in isolated Chromium and returns a screenshot and page metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserRunInput"
      responses:
        "403":
          description: Activity logging acceptance is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "200":
          description: Browser run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserRunResult"
        "400":
          description: Invalid URL or blocked destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "502":
          description: The page could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "429":
          description: All browser slots are currently in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
components:
  schemas:
    ChatNameInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 24
          pattern: '^[A-Za-z0-9_-]+$'
    ActivityConsentInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ActivityConsent:
      type: object
      required: [decided, enabled, deviceId, token]
      properties:
        decided:
          type: boolean
        enabled:
          type: boolean
        deviceId:
          type: [string, "null"]
        token:
          type: [string, "null"]
    OwnerAccess:
      type: object
      required: [signedIn, owner]
      properties:
        signedIn:
          type: boolean
        owner:
          type: boolean
    DeviceReviewInput:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
    VisitorDevice:
      type: object
      required: [deviceId, firstSeen, lastSeen, browser, platform, username, isNew, consentActive]
      properties:
        deviceId:
          type: string
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        browser:
          type: string
        platform:
          type: string
        username:
          type: [string, "null"]
        isNew:
          type: boolean
        consentActive:
          type: boolean
    VisitorDevicePage:
      type: object
      required: [devices, total, newCount, page, pageSize]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/VisitorDevice"
        total:
          type: integer
        newCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ChatMessageInput:
      type: object
      additionalProperties: false
      required: [username, message]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 24
          pattern: '^[a-zA-Z0-9_-]+$'
        message:
          type: string
          minLength: 1
          maxLength: 1000
    ChatMessage:
      type: object
      required: [id, username, message, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrowserRunInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
      required:
        - url
    BrowserRunResult:
      type: object
      properties:
        requestedUrl:
          type: string
        finalUrl:
          type: string
        title:
          type: string
        status:
          type: integer
        screenshot:
          type: string
          description: Data URL containing a compressed JPEG screenshot
        elapsedMs:
          type: integer
        textExcerpt:
          type: string
      required:
        - requestedUrl
        - finalUrl
        - title
        - status
        - screenshot
        - elapsedMs
        - textExcerpt
    BrowserError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

