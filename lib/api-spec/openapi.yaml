openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: browser
    description: Public web page browser operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /browser/run:
    post:
      operationId: runBrowser
      tags: [browser]
      summary: Open a public web page in Chromium
      description: Opens a public HTTP or HTTPS page in isolated Chromium and returns a screenshot and page metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserRunInput"
      responses:
        "200":
          description: Browser run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserRunResult"
        "400":
          description: Invalid URL or blocked destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "502":
          description: The page could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "429":
          description: All browser slots are currently in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrowserRunInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
      required:
        - url
    BrowserRunResult:
      type: object
      properties:
        requestedUrl:
          type: string
        finalUrl:
          type: string
        title:
          type: string
        status:
          type: integer
        screenshot:
          type: string
          description: Data URL containing a compressed JPEG screenshot
        elapsedMs:
          type: integer
        textExcerpt:
          type: string
      required:
        - requestedUrl
        - finalUrl
        - title
        - status
        - screenshot
        - elapsedMs
        - textExcerpt
    BrowserError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

